<!-- ===================== SCRIPT 3/5: Home (current month) & Activity views ===================== -->
<script>
'use strict';
const methodIcon = m => (METHODS.find(x => x[0] === m) || ['', '💳'])[1];
const shortDate = s => { const d = parseD(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
function txRow(t, showDate) {
  const c = cat(t.type, t.category), tags = (t.tags || []).slice(0, 2).map(g => `<span class="tag">#${esc(g)}</span>`).join('');
  const fut = isFuture(t), badge = fut ? '<span class="tag sched">⏳ Upcoming</span>' : '';
  if (t.type === 'transfer') {
    const f = accById(t.fromId), to = accById(t.toId);
    return `<div class="tx${fut ? ' future' : ''}" data-action="edit-tx" data-id="${esc(t.id)}">
    <div class="tx-ic" style="background:rgba(14,165,233,.14)">💳</div>
    <div class="tx-main"><div class="tx-title">${esc(t.note || 'Card bill payment')}</div>
      <div class="tx-sub">${badge}<span>🏦 ${esc(f ? f.name : 'Account')} → ${esc(to ? to.name : 'Card')}</span></div></div>
    <div class="tx-amt transfer">↔ ${fmtX(t.amount)}${showDate ? `<small>${shortDate(t.date)}</small>` : ''}</div>
  </div>`;
  }
  const card = t.cardId && accById(t.cardId), via = card ? card.name : (t.method || '');
  return `<div class="tx${fut ? ' future' : ''}" data-action="edit-tx" data-id="${esc(t.id)}">
    <div class="tx-ic" style="background:${hexA(c.color, .16)}">${c.icon}</div>
    <div class="tx-main"><div class="tx-title">${esc(t.note || t.category)}</div>
      <div class="tx-sub">${badge}${t.note ? `<span>${esc(t.category)}</span>·` : ''}<span>${methodIcon(t.method)} ${esc(via)}</span>${tags}</div></div>
    <div class="tx-amt ${t.type}">${t.type === 'income' ? '+' : '−'}${fmtX(t.amount)}${showDate ? `<small>${shortDate(t.date)}</small>` : ''}</div>
  </div>`;
}
function catTotals(tx, type) {
  const m = {}; tx.filter(t => t.type === type).forEach(t => m[t.category] = (m[t.category] || 0) + t.amount);
  return Object.entries(m).map(([name, value]) => ({ name, value, ...(({ icon, color }) => ({ icon, color }))(cat(type, name)) })).sort((a, b) => b.value - a.value);
}

/* ================= HOME ================= */
// Home section order (credit card dues near the bottom) + collapsible sections, remembered per device.
const COLLAPSE_KEY = 'paisa_collapsed';
const collapsed = (() => { try { return new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY)) || []); } catch (e) { return new Set(); } })();
// sections collapsed until the user opens them (stored as '+key' once opened)
const DEF_COLL = new Set(['bills']);
const isColl = k => DEF_COLL.has(k) ? !collapsed.has('+' + k) : collapsed.has(k);
function setColl(k, c) {
  if (DEF_COLL.has(k)) { if (c) collapsed.delete('+' + k); else collapsed.add('+' + k); }
  else if (c) collapsed.add(k); else collapsed.delete(k);
  localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsed]));
}
function secWrap(key, html) {
  if (!html) return '';
  // the section's first header becomes the toggle (chevron added via CSS)
  const i = html.indexOf('<div class="card-h"');
  if (i >= 0) {
    const j = html.indexOf('>', i);
    html = html.slice(0, i) + `<div class="card-h" data-action="toggle-sec" data-sec="${key}" role="button" aria-expanded="${!isColl(key)}"` + html.slice(i + 19, j) + '>' + html.slice(j + 1);
  }
  return `<section class="hsec${isColl(key) ? ' collapsed' : ''}" data-sec="${key}">${html}</section>`;
}
ACTIONS['toggle-sec'] = el => {
  const k = el.dataset.sec, wrap = el.closest('.hsec'); if (!wrap) return;
  const on = !wrap.classList.toggle('collapsed'); el.setAttribute('aria-expanded', on);
  setColl(k, !on);
};
function renderHome(el) {
  if (S.month > curYM()) { el.innerHTML = renderFutureMonth(S.month); return; }
  const m = S.month;
  el.innerHTML = reviewBanner() + spendHero(m) + homeNav(m)
    + emiSummary(m) + (m === curYM() ? cardSummary() : '') + budgetSummary(m)
    + secWrap('bills', recurCard(m));
}

/* Top card: total spent this month with daily bars + category split */
function spendHero(m) {
  const tx = txOfMonth(m), pm = addMonths(m, -1), ptx = txOfMonth(pm), isCur = m === curYM(), dim = daysInMonth(m);
  const dayN = isCur ? new Date().getDate() : dim, exp = expOf(tx), inc = incOf(tx), net = inc - exp;
  const same = expOf(ptx.filter(t => +t.date.slice(8) <= dayN)), d = same ? (exp - same) / same * 100 : null;
  const daily = Array(dim).fill(0);
  tx.forEach(t => { if (t.type === 'expense') daily[+t.date.slice(8) - 1] += t.amount; });
  // One huge day would flatten the rest, so the scale is capped near the typical day; taller bars are clipped and marked.
  const nz = daily.filter(v => v > 0).sort((a, b) => a - b), peak = Math.max(...daily, 1), H = 60;
  const mx = nz.length > 2 ? Math.min(peak, Math.max(nz[Math.floor((nz.length - 1) * .8)] * 1.6, 1)) : peak;
  const bars = daily.map((v, i) => {
    const day = i + 1, ds = `${m}-${pad(day)}`, fut = day > dayN, clip = v > mx * 1.01, h = v ? Math.max(4, Math.min(1, v / mx) * (H - 2)) : 2;
    return `<rect x="${i * 10 + 1.5}" y="${H - h}" width="7" height="${h}" rx="2" class="${fut ? 'fut' : isCur && day === dayN ? 'tdy' : v ? 'on' : ''}"${fut ? '' : ` data-action="day" data-d="${ds}" data-tip="${shortDate(ds)}: ${fmt(v)}"`}/>${clip ? `<rect x="${i * 10 + 1.5}" y="${H - h + 5}" width="7" height="1.6" class="brk" pointer-events="none"/>` : ''}`;
  }).join('');
  const cats = catTotals(tx, 'expense'), top = cats.slice(0, 4), rest = exp - sum(top, c => c.value);
  const segs = [...top.map(c => ({ ...c })), ...(rest > 0 ? [{ name: 'Others', value: rest, color: '#cbd5e1', icon: '•' }] : [])];
  return `<div class="hero sp-hero">
    <div class="hero-top"><span class="chip-glass">📅 ${mLabel(m, true)}</span><button class="chip-glass" data-action="go-insights">Insights ›</button></div>
    <div class="hero-label">${isCur ? 'Spent this month' : `Spent in ${mLong(m)}`}</div>
    <div class="hero-amt">${fmt(exp)}</div>
    <div class="hero-delta">${d === null ? (isCur ? `Day ${dayN} of ${dim}` : '&nbsp;') : `${d <= 0 ? '▼' : '▲'} ${Math.abs(d).toFixed(0)}% ${d <= 0 ? 'less' : 'more'} than ${isCur ? 'this point in ' : ''}${MONTHS[+pm.slice(5) - 1]} (${fmtC(same)})`}</div>
    <div class="sp-chart"><svg viewBox="0 0 ${dim * 10} ${H}" preserveAspectRatio="none" aria-label="Daily spending">${bars}</svg>
      <div class="sp-ax"><span>1</span><span>${Math.ceil(dim / 2)}</span><span>${dim}</span></div></div>
    ${exp ? `<div class="sp-strip" data-action="go-insights">${segs.map(c => `<i style="width:${c.value / exp * 100}%;background:${c.color}"></i>`).join('')}</div>
    <div class="sp-leg">${segs.slice(0, 4).map(c => `<span><i style="background:${c.color}"></i>${c.icon} ${esc(c.name)} <b>${fmtC(c.value)}</b></span>`).join('')}</div>` : '<div class="sp-leg"><span>No expenses yet — tap ＋ to add one.</span></div>'}
    <div class="sp-stats">
      <div><small>Income</small><b>${fmtC(inc)}</b></div>
      <div><small>${net >= 0 ? 'Saved' : 'Overspent'}</small><b>${fmtC(Math.abs(net))}</b></div>
      <div><small>Avg / day</small><b>${fmtC(exp / dayN)}</b></div>
    </div></div>`;
}

/* Icon shortcuts to every section */
function homeNav(m) {
  const pendRec = m <= curYM() ? D.recurring.filter(r => recVisible(r, m) && ['due', 'due-today', 'overdue', 'missed'].includes(recState(r, m))).length : 0;
  const pendEmi = D.emis.filter(e => { const i = monthDiff(e.start, m); return i >= 0 && i < e.tenure && emiState(e, m) !== 'paid'; }).length;
  const nCards = serverOutdated() ? 0 : cards().filter(c => (cardDue(c) || 0) > 0).length;
  const rv = typeof Inbox !== 'undefined' ? Inbox.items.filter(i => !i.status).length : 0;
  const it = [
    ['data-tab="txns"', '🧾', 'Activity', rv], ['data-action="go-calendar"', '📅', 'Calendar', 0],
    ['data-action="go-insights"', '📊', 'Insights', 0], ['data-tab="worth"', '🏦', 'Net worth', 0],
    ['data-action="emi-manage"', '📆', 'EMIs', pendEmi], ['data-action="go-cards"', '💳', 'Cards', nCards],
    ['data-action="rec-manage"', '🔁', 'Bills', pendRec], ['data-action="settings"', '⚙️', 'Settings', 0],
  ];
  return `<nav class="qnav">${it.map(([a, e, l, n]) => `<button class="qn" ${a}><span class="qi">${e}${n ? `<em>${n}</em>` : ''}</span><span>${l}</span></button>`).join('')}</nav>`;
}
ACTIONS['go-cards'] = () => {
  setTab('worth');
  requestAnimationFrame(() => { const h = [...$$('#view-worth h3')].find(x => /Credit card/.test(x.textContent)); h && h.closest('.card').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
};
ACTIONS['go-budget'] = () => { S.range = 'mo'; setColl('budget', false); setTab('dash'); };

const sumCard = (act, title, sub, right, body) => `<div class="card sumc" data-action="${act}" role="button">
  <div class="card-h"><div><h3>${title}</h3><div class="sub">${sub}</div></div><div class="sumc-r">${right}<span class="chev">›</span></div></div>${body}</div>`;

function emiSummary(m) {
  const active = D.emis.filter(e => emiPaid(e) < e.tenure);
  const inM = D.emis.filter(e => { const i = monthDiff(e.start, m); return i >= 0 && i < e.tenure; });
  if (!active.length && !inM.length) return '';
  const st = e => emiState(e, m), due = sum(inM, e => e.amount), paid = sum(inM.filter(e => st(e) === 'paid'), e => e.amount);
  const pend = inM.filter(e => st(e) !== 'paid').sort((a, b) => a.dueDay - b.dueDay), late = pend.filter(e => ['overdue', 'missed'].includes(st(e))).length;
  const end = active.map(emiEnd).sort().pop(), next = pend[0];
  const pill = late ? `<span class="pill over">${late} overdue</span>` : pend.length ? `<span class="pill warn">${pend.length} pending</span>` : inM.length ? '<span class="pill ok">✓ Paid</span>' : '';
  return sumCard('emi-manage', '📆 EMIs running', `${active.length} active${end ? ` · debt-free by ${mLabel(end, true)}` : ''}`, pill, `
    <div class="stats3" style="margin-top:0">
      <div class="stat"><div class="l">This month</div><div class="v">${fmtC(due)}</div></div>
      <div class="stat"><div class="l">Paid</div><div class="v pos">${fmtC(paid)}</div></div>
      <div class="stat"><div class="l">Outstanding</div><div class="v">${fmtC(sum(active, emiLeft))}</div></div></div>
    ${due ? `<div class="emi-prog" style="margin:10px 0 0"><i class="${paid >= due ? 'done' : ''}" style="width:${paid / due * 100}%"></i></div>` : ''}
    ${next ? `<div class="sumc-f">Next: ${next.icon || '💳'} ${esc(next.name)} · ${fmt(next.amount)} on ${ordinal(next.dueDay)}</div>` : ''}`);
}

function cardSummary() {
  if (serverOutdated()) return '';
  const list = cards().map(c => ({ c, due: cardDue(c) || 0 })).filter(x => x.due > 0).sort((a, b) => b.due - a.due);
  if (!list.length) return '';
  const day = new Date().getDate();
  return sumCard('go-cards', '💳 Credit cards', `${list.length} with outstanding balance`, `<b class="neg num">${fmtC(sum(list, x => x.due))}</b>`,
    list.map(({ c, due }) => {
      const lim = +c.limit || 0, u = lim ? due / lim * 100 : 0, dd = c.dueDay ? (c.dueDay - day + daysInMonth(curYM())) % daysInMonth(curYM()) : null;
      return `<div class="sumc-row"><span class="n">${esc(c.name)}${c.dueDay ? `<small>bill due ${ordinal(c.dueDay)}${dd !== null && dd <= 5 ? ` · <b class="neg">${dd ? `in ${dd}d` : 'today'}</b>` : ''}</small>` : ''}</span>
        <span class="r"><b class="num">${fmt(due)}</b>${lim ? `<i class="mini"><i style="width:${clamp(u, 0, 100)}%;${u > 70 ? 'background:#f43f5e' : ''}"></i></i>` : ''}</span></div>`;
    }).join(''));
}

function budgetSummary(m) {
  const budget = +D.settings.budget || 0;
  if (!budget) return m === curYM() ? sumCard('settings', '🎯 Monthly budget', 'Set a spending limit to track your pace', '', '') : '';
  const exp = expOf(txOfMonth(m)), isCur = m === curYM(), dim = daysInMonth(m), dayN = isCur ? new Date().getDate() : dim;
  const pct = exp / budget * 100, pace = dayN / dim * 100, cls = exp > budget ? 'over' : isCur && pct > pace * 1.05 ? 'warn' : 'ok';
  const left = budget - exp, safe = isCur ? Math.max(0, left) / (dim - dayN + 1) : 0;
  return sumCard('go-budget', '🎯 Monthly budget', `${fmtC(exp)} of ${fmtC(budget)} · ${pct.toFixed(0)}% used`, `<span class="pill ${cls}">${{ over: 'Over budget', warn: 'Above pace', ok: 'On track' }[cls]}</span>`, `
    <div class="progress" style="margin:4px 0 8px"><div class="bar ${cls === 'ok' ? '' : cls}" style="width:${clamp(pct, 0, 100)}%"></div>${isCur ? `<div class="pace-mark" style="left:${pace}%"></div>` : ''}</div>
    <div class="sumc-f" style="margin-top:0;display:flex;justify-content:space-between"><span class="${left < 0 ? 'neg' : ''}">${left < 0 ? fmtC(-left) + ' over' : fmtC(left) + ' left'}</span>${isCur ? `<span>Safe to spend <b>${fmtC(safe)}</b>/day</span>` : ''}</div>`);
}

/* Insight tiles (Insights → Month) */
function monthInsights(m) {
  const tx = txOfMonth(m), pm = addMonths(m, -1), ptx = txOfMonth(pm), inc = incOf(tx), exp = expOf(tx);
  const rate = inc ? (inc - exp) / inc * 100 : 0, isCur = m === curYM(), dayN = isCur ? new Date().getDate() : daysInMonth(m);
  const budget = +D.settings.budget || 0, cats = catTotals(tx, 'expense'), ins = [];
  if (cats[0]) ins.push(['🏆', `<b>${esc(cats[0].name)}</b> is your top spend at <b>${fmt(cats[0].value)}</b> (${(cats[0].value / exp * 100).toFixed(0)}% of expenses).`]);
  if (ptx.length && exp) {
    const same = expOf(ptx.filter(t => +t.date.slice(8) <= dayN)), d = same ? (exp - same) / same * 100 : 0;
    if (same) ins.push([d <= 0 ? '📉' : '📈', `You've spent <b>${Math.abs(d).toFixed(0)}% ${d <= 0 ? 'less' : 'more'}</b> than the same point in ${mLong(pm)}.`]);
  }
  const big = tx.filter(t => t.type === 'expense' && !isFixed(t)).sort((a, b) => b.amount - a.amount)[0];
  if (big) ins.push(['💸', `Biggest one-off spend: <b>${fmt(big.amount)}</b> on ${esc(big.note || big.category)} (${shortDate(big.date)}).`]);
  const ns = dayN - new Set(tx.filter(t => t.type === 'expense').map(t => t.date)).size;
  if (tx.length) ins.push(['🧘', `<b>${ns} no-spend day${ns === 1 ? '' : 's'}</b> ${isCur ? 'so far' : ''} this month. ${ns >= 5 ? 'Nice discipline!' : 'Try a few more!'}`]);
  if (inc) ins.push(['🎯', `Savings rate is <b>${rate.toFixed(0)}%</b>. ${rate >= 30 ? 'Excellent — keep it up!' : rate >= 20 ? 'Healthy — aim for 30%.' : 'Aim for 20%+ to build wealth.'}`]);
  const schedExp = isCur ? expOf(txOfMonth(m, true).filter(isFuture)) : 0;
  if (schedExp) ins.unshift(['⏳', `<b>${fmt(schedExp)}</b> more is scheduled later this month${budget ? ` — <b>${fmt(budget - exp - schedExp)}</b> of budget left after that` : ''}.`]);
  return ins.length ? `<div class="ins-row">${ins.map(([e, p]) => `<div class="ins"><span class="e">${e}</span><p>${p}</p></div>`).join('')}</div>` : '';
}
function budgetCard(m) {
  const budget = +D.settings.budget || 0; if (!budget) return '';
  const exp = expOf(txOfMonth(m)), isCur = m === curYM(), dim = daysInMonth(m), dayN = isCur ? new Date().getDate() : dim, daysLeft = isCur ? dim - dayN + 1 : 0;
  const pct = exp / budget * 100, pace = dayN / dim * 100, cls = exp > budget ? 'over' : isCur && pct > pace * 1.05 ? 'warn' : 'ok';
  const lbl = { over: 'Over budget', warn: 'Above pace', ok: 'On track' }[cls];
  const projected = isCur ? exp / dayN * dim : exp;
  return `<div class="card">
      <div class="card-h"><div><h3>Monthly budget</h3><div class="sub">${fmt(budget)} limit · <a class="link" data-action="settings">edit</a></div></div><span class="pill ${cls}">${lbl}</span></div>
      <div class="budget-top"><div><span class="big">${fmt(exp)}</span> <span class="muted sm">spent</span></div><div class="sm ${exp > budget ? 'neg' : 'muted'}">${exp > budget ? fmt(exp - budget) + ' over' : fmt(budget - exp) + ' left'}</div></div>

        <div class="stat"><div class="l">${isCur ? 'Projected' : 'Final'}</div><div class="v ${projected > budget ? 'neg' : 'pos'}">${fmtC(projected)}</div></div>

/* Month analysis (shown in Insights → Month; calendar also in Activity) */
function monthSections(m) {
  const tx = txOfMonth(m), pm = addMonths(m, -1), ptx = txOfMonth(pm);
  const inc = incOf(tx), exp = expOf(tx), isCur = m === curYM(), dim = daysInMonth(m);
  const dayN = isCur ? new Date().getDate() : dim, budget = +D.settings.budget || 0;
  const cats = catTotals(tx, 'expense'), sec = {};
  // spending pace chart (cumulative)
  const pdim = daysInMonth(pm), cum = (list, n, cut) => { let c = 0; const by = {}; list.filter(t => t.type === 'expense').forEach(t => by[+t.date.slice(8)] = (by[+t.date.slice(8)] || 0) + t.amount); return Array.from({ length: n }, (_, i) => (i + 1 > cut ? null : (c += by[i + 1] || 0))); };
  const days = Array.from({ length: dim }, (_, i) => String(i + 1));
  const series = [
    { name: mLabel(pm), color: '#64748b', values: cum(ptx, dim, pdim), dashed: true, dots: false, width: 2 },
    { name: mLabel(m), color: '#f43f5e', values: cum(tx, dim, dayN), area: true, dotR: 2 },
  ];
  if (budget) series.unshift({ name: 'Budget pace', color: '#f59e0b', values: days.map((_, i) => budget * (i + 1) / dim), dots: false, width: 1.4, dashed: true });
  sec.pace = `<div class="card"><div class="card-h"><div><h3>Spending pace</h3><div class="sub">Cumulative expenses by day</div></div></div>
    ${lineChart({ labels: days, series, h: 170, tipLabels: days.map(d => 'Day ' + d) })}
    <div class="legend"><span><i style="background:#f43f5e"></i>${mLabel(m)}</span><span style="color:#64748b"><i class="dash"></i>${mLabel(pm)}</span>${budget ? '<span style="color:#f59e0b"><i class="dash"></i>Budget</span>' : ''}</div></div>`;

  // calendar heatmap
  const daily = {}, incDays = new Set();
  tx.forEach(t => { if (t.type === 'expense') daily[+t.date.slice(8)] = (daily[+t.date.slice(8)] || 0) + t.amount; else incDays.add(+t.date.slice(8)); });
  const vals = Object.values(daily).sort((a, b) => a - b), cap = vals[Math.floor(vals.length * .9)] || 1;
  const first = parseD(m + '-01').getDay(), td = today();
  let cal = WD.map(w => `<div class="wd">${w[0]}</div>`).join('') + '<div></div>'.repeat(first);
  const sched = {}; txOfMonth(m, true).filter(isFuture).forEach(t => { const d = +t.date.slice(8); sched[d] = (sched[d] || 0) + (t.type === 'expense' ? t.amount : 0) + (t.type === 'income' ? 1e-9 : 0); });
  for (let d = 1; d <= dim; d++) {
    const ds = `${m}-${pad(d)}`, v = daily[d] || 0, a = v ? .14 + .7 * Math.min(1, v / cap) : 0, fut = ds > td, sc = fut && sched[d] !== undefined;
    cal += `<div class="d${ds === td ? ' today' : ''}${fut ? ' future' : ''}${sc ? ' sched' : ''}${incDays.has(d) ? ' hasinc' : ''}" ${fut && !sc ? '' : `data-action="day" data-d="${ds}"`} style="${v ? `background:${hexA('#f43f5e', a)};${a > .5 ? 'color:#fff' : ''}` : ''}">${d}${v ? `<small>${fmtC(v).replace('₹', '')}</small>` : sc ? `<small>${sched[d] >= 1 ? fmtC(sched[d]).replace('₹', '') : '＋'}</small>` : ''}</div>`;
  }
  sec.calendar = `<div class="card"><div class="card-h"><div><h3>Daily spending</h3><div class="sub">Tap a day for details · <span class="pos">●</span> income${Object.keys(sched).length ? ' · <span style="color:var(--accent)">dashed</span> = scheduled' : ''}</div></div></div><div class="cal">${cal}</div></div>`;

  // categories
  let c = `<div class="card"><div class="card-h"><div><h3>Where it went</h3><div class="sub">${cats.length} categories</div></div>${cats.length > 5 ? '<a class="link" data-action="all-cats">See all</a>' : ''}</div>`;
  if (cats.length) {
    c += donut(cats, { center: fmtC(exp), sub: 'spent' }) + '<div style="margin-top:10px">';
    c += catBars(cats.slice(0, 5), exp, ptx) + '</div>';
  } else c += emptyState('🪙', 'No expenses yet', 'Tap + to log your first expense.');
  sec.categories = c + '</div>';

  // income sources
  const incs = catTotals(tx, 'income');
  if (incs.length) sec.income = `<div class="card"><div class="card-h"><div><h3>Income sources</h3><div class="sub">${fmt(inc)} total</div></div></div>${catBars(incs, inc, ptx, 'income')}</div>`;

  return sec;
}
function calendarCard(m) { return monthSections(m).calendar; }
ACTIONS['go-insights'] = () => { S.range = 'mo'; setTab('dash'); };
ACTIONS['go-calendar'] = () => { S.txScope = 'month'; setColl('calendar', false); setTab('txns'); };
const byDateAsc = (a, b) => a.date.localeCompare(b.date) || (a.ts || 0) - (b.ts || 0);
function upcomingCard(m) {

      <div class="hs"><div class="hs-ic"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></div><div><div class="hs-l">Scheduled expenses</div><div class="hs-v">${fmt(exp)}</div></div></div>

  return h;
}
ACTIONS['see-upcoming'] = () => { S.txScope = 'all'; S.f = { q: '', type: 'all', cat: '', method: '', tag: '' }; setTab('txns'); };
function catBars(list, total, ptx, type = 'expense') {
  const prev = {}; catTotals(ptx, type).forEach(c => prev[c.name] = c.value);

  wrap.innerHTML = h;
}

  const ws = months.map(m => worthAt(m));

      <div class="legend"><span><i style="background:#22d3ee"></i>Total assets</span><span><i style="background:#8b5cf6"></i>Net worth</span><span class="neg">Liabilities ${fmtC(li[li.length - 1])}</span></div></div>`;
  }

  const cats = catTotals(tx, 'expense');
  h += `<div class="card"><div class="card-h"><div><h3>Expense breakdown</h3><div class="sub">Fixed costs ${TE ? (fixed / TE * 100).toFixed(0) : 0}% · variable ${TE ? (100 - fixed / TE * 100).toFixed(0) : 0}%</div></div></div>
    ${cats.length ? donut(cats, { center: fmtC(TE), sub: 'total', max: 7 }) : emptyState('📊', 'No data', 'No expenses in this period.')}</div>`;

  if (cats.length && n > 1) {
    const top = cats.slice(0, 8), grid = top.map(c => months.map(m => expOf(txOfMonth(m).filter(t => t.category === c.name))));
    const mx = Math.max(...grid.flat(), 1);
    h += `<div class="card"><div class="card-h"><div><h3>Category trend</h3><div class="sub">Top ${top.length} categories by month · scroll →</div></div></div><div class="heat"><table>
      <tr><th></th>${labs.map(l => `<th>${l}</th>`).join('')}</tr>
      ${top.map((c, r) => `<tr><td class="c">${c.icon} ${esc(c.name)}</td>${grid[r].map((v, i) => `<td class="v" data-tip="${esc(c.name)} · ${tips[i]}: ${fmt(v)}" style="background:${v ? hexA(c.color, .12 + .78 * v / mx) : 'var(--surface-2)'};${v / mx > .55 ? 'color:#fff' : ''}">${v ? fmtC(v).replace('₹', '') : '·'}</td>`).join('')}</tr>`).join('')}

  }

  const wd = Array(7).fill(0), wdN = Array(7).fill(0), seen = new Set();
  months.forEach(m => { const dim = m === curYM() ? new Date().getDate() : daysInMonth(m); for (let d = 1; d <= dim; d++) wdN[parseD(`${m}-${pad(d)}`).getDay()]++; });
  tx.filter(t => t.type === 'expense' && !isFixed(t)).forEach(t => { wd[parseD(t.date).getDay()] += t.amount; seen.add(t.date); });
  const wdAvg = wd.map((v, i) => wdN[i] ? v / wdN[i] : 0), maxI = wdAvg.indexOf(Math.max(...wdAvg));
  h += `<div class="card"><div class="card-h"><div><h3>Spending by weekday</h3><div class="sub">Avg variable spend per day · peak on ${WD[maxI]}</div></div></div>
    ${barChart({ labels: WD, h: 150, series: [{ name: 'Avg/day', color: (v, i) => i === maxI ? '#f43f5e' : '#8b5cf6', values: wdAvg }] })}</div>`;

  const byM = {}; tx.filter(t => t.type === 'expense').forEach(t => byM[t.method] = (byM[t.method] || 0) + t.amount);
  const mcol = { UPI: '#8b5cf6', Card: '#ec4899', Cash: '#22c55e', 'Bank Transfer': '#38bdf8', Wallet: '#f59e0b' };
  h += `<div class="card"><div class="card-h"><div><h3>Payment methods</h3><div class="sub">How you pay</div></div></div>
    ${donut(Object.entries(byM).map(([k, v]) => ({ name: k, value: v, color: mcol[k] || '#94a3b8', icon: methodIcon(k) })), { size: 120, center: Object.keys(byM).length, sub: 'methods' })}</div>`;

  const tagT = {}; tx.filter(t => t.type === 'expense').forEach(t => (t.tags || []).forEach(g => tagT[g] = (tagT[g] || 0) + t.amount));
  const tg = Object.entries(tagT).sort((a, b) => b[1] - a[1]).slice(0, 8);
  if (tg.length) h += `<div class="card"><div class="card-h"><div><h3>Top tags</h3><div class="sub">Tap to view transactions</div></div></div>
    ${tg.map(([g, v]) => `<div class="cbar" data-action="tag-go" data-v="${esc(g)}" style="cursor:pointer"><div class="ic" style="background:rgba(139,92,246,.14);font-size:15px">#</div><div class="mid"><div class="top"><span>${esc(g)}</span><span class="num">${fmt(v)}</span></div><div class="track"><div class="fill" style="width:${v / tg[0][1] * 100}%;background:var(--grad)"></div></div></div></div>`).join('')}</div>`;

  const big = tx.filter(t => t.type === 'expense' && !isFixed(t)).sort((a, b) => b.amount - a.amount).slice(0, 5);
  if (big.length) h += `<div class="card-h" style="margin:20px 4px 10px"><div><h3>Largest one-off expenses</h3><div class="sub muted sm">Excludes recurring bills, EMIs & subscriptions</div></div></div><div class="tx-list">${big.map(t => txRow(t, true)).join('')}</div>`;
  el.innerHTML = h;
}
ACTIONS['range'] = el => { S.range = el.dataset.v; render(); };
const RANGE_SEG = () => `<div class="seg" style="margin:4px 0 14px">${Object.entries({ mo: 'Month', 3: '3M', 6: '6M', 12: '12M', fy: 'FY', all: 'All' }).map(([v, l]) => `<button data-action="range" data-v="${v}" class="${S.range === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;

  el.innerHTML = h;

  catch (e) { toast('Could not load the script. Use "Open script" and copy it from there.'); return false; }

  if (Setup.done() && !await confirmDlg('Connect to this Sheet?', 'This device is already set up. Switch it to the Sheet from the link you opened?', 'Switch')) return;
  Setup.set({ mode: 'sheets', url: u, steps: [] }); Wiz.finish(); toast('Connected ✓ Enter your password');
}

<!-- ===================== SCRIPT 6: Short-term EMI tracker ===================== -->
<script>
'use strict';
// An EMI plan: { id, name, icon, amount (monthly), tenure (months), start 'YYYY-MM', dueDay, method, lender, prepaid }
// Paid installments = prepaid (paid before tracking) + expense transactions linked via emiId.
const EMI_ICONS = ['📱', '💻', '📺', '❄️', '🛋️', '🏍️', '🧺', '🎧', '⌚', '📷', '🛒', '💳'];
const monthDiff = (a, b) => { const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by - ay) * 12 + bm - am; };
const emiPaid = e => Math.min(e.tenure, (+e.prepaid || 0) + D.txns.filter(t => t.emiId === e.id).length);
const emiEnd = e => addMonths(e.start, e.tenure - 1);
const emiLeft = e => (e.tenure - emiPaid(e)) * e.amount;
const ordinal = n => n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');

// Status of an EMI for month m: upcoming | paid | due | due-today | overdue | missed | done
function emiState(e, m) {
  const i = monthDiff(e.start, m), paid = emiPaid(e), cur = curYM();
  if (paid >= e.tenure) return i >= 0 && i < e.tenure ? 'paid' : 'done';
  if (i < 0) return 'upcoming';
  if (paid > i) return 'paid';
  if (m < cur) return 'missed';
  if (m > cur) return 'upcoming';
  const day = new Date().getDate(), due = Math.min(e.dueDay, daysInMonth(m));
  if (paid < Math.min(i, e.tenure)) return 'overdue';
  return day > due ? 'overdue' : day === due ? 'due-today' : 'due';
}
const EMI_PILL = {
  paid: ['ok', '✓ Paid'], due: ['', 'Due'], 'due-today': ['warn', 'Due today'], overdue: ['over', 'Overdue'],
  missed: ['over', 'Missed'], upcoming: ['', 'Upcoming'], done: ['ok', '🎉 Closed'],
};
function emiRow(e, m, withPay) {
  const paid = emiPaid(e), st = emiState(e, m), [cls, lbl] = EMI_PILL[st];
  const due = Math.min(e.dueDay, daysInMonth(m)), dl = due - new Date().getDate();
  const lbl2 = st === 'due' ? `Due in ${dl}d` : lbl;
  const canPay = withPay && paid < e.tenure && ['due', 'due-today', 'overdue'].includes(st);
  return `<div class="emi"><div class="emi-top" data-action="emi-edit" data-id="${esc(e.id)}" style="cursor:pointer">
      <div class="ic">${e.icon || '💳'}</div>
      <div class="mid"><div class="n">${esc(e.name)}</div><div class="g">${fmt(e.amount)}/mo · due ${ordinal(e.dueDay)}${e.lender ? ' · ' + esc(e.lender) : ''}</div></div>
      <div class="r"><span class="pill ${cls}">${lbl2}</span>${canPay ? `<button class="btn xs primary" data-action="emi-pay" data-id="${esc(e.id)}">Pay ${fmtC(e.amount)}</button>` : ''}</div></div>
    <div class="emi-prog"><i class="${paid >= e.tenure ? 'done' : ''}" style="width:${paid / e.tenure * 100}%"></i></div>
    <div class="emi-meta"><span>${paid}/${e.tenure} paid</span><span>${paid >= e.tenure ? 'Completed ' + mLabel(emiEnd(e)) : `${fmt(emiLeft(e))} left · ends ${mLabel(emiEnd(e))}`}</span></div></div>`;
}

/* ---------- Home card (for the selected month) ---------- */
function emiCard(m) {
  const list = D.emis.filter(e => { const i = monthDiff(e.start, m); return (i >= 0 && i < e.tenure) || (i >= e.tenure && emiPaid(e) < e.tenure && m === curYM()); });
  if (!D.emis.length) return `<div class="card"><div class="card-h"><div><h3>Short-term EMIs</h3><div class="sub">No-cost EMI, BNPL, credit-card EMIs</div></div></div>
    <p class="muted sm" style="margin-bottom:12px">Track gadgets & purchases on EMI — see what's due, what's paid and when each one ends.</p>
    <button class="btn ghost block" data-action="emi-add">+ Add an EMI</button></div>`;
  const inMonth = list.filter(e => monthDiff(e.start, m) < e.tenure);
  const dueAmt = sum(inMonth, e => e.amount), paidAmt = sum(inMonth.filter(e => emiState(e, m) === 'paid'), e => e.amount);
  const outstanding = sum(D.emis, e => emiLeft(e)), active = D.emis.filter(e => emiPaid(e) < e.tenure).length;
  const order = { overdue: 0, 'due-today': 1, due: 2, missed: 3, paid: 4, upcoming: 5, done: 6 };
  list.sort((a, b) => order[emiState(a, m)] - order[emiState(b, m)] || a.dueDay - b.dueDay);
  const pending = inMonth.filter(e => emiState(e, m) !== 'paid').length;
  return `<div class="card"><div class="card-h"><div><h3>Short-term EMIs</h3><div class="sub">${active} active · ${pending ? `${pending} pending this month` : 'all paid this month ✓'}</div></div><a class="link" data-action="emi-manage">Manage</a></div>
    <div class="stats3" style="margin:0 0 6px">
      <div class="stat"><div class="l">This month</div><div class="v">${fmt(dueAmt)}</div></div>
      <div class="stat"><div class="l">Paid</div><div class="v pos">${fmt(paidAmt)}</div></div>
      <div class="stat"><div class="l">Outstanding</div><div class="v">${fmtC(outstanding)}</div></div>
    </div>
    ${list.length ? list.map(e => emiRow(e, m, m === curYM())).join('') : '<p class="muted sm" style="padding:10px 0">No EMIs due in this month.</p>'}</div>`;
}

/* ---------- Net Worth card ---------- */
function emiWorthCard() {
  const act = D.emis.filter(e => emiPaid(e) < e.tenure); if (!act.length) return '';
  const last = act.map(emiEnd).sort().pop();
  return `<div class="card"><div class="card-h"><div><h3>Short-term EMIs</h3><div class="sub">Not included in liabilities above · debt-free by ${mLabel(last, true)}</div></div><span class="neg num" style="font-weight:700">${fmt(sum(act, emiLeft))}</span></div>
    ${act.map(e => emiRow(e, curYM(), false)).join('')}
    <button class="btn ghost block" style="margin-top:10px" data-action="emi-manage">Manage EMIs</button></div>`;
}

/* ---------- actions ---------- */
ACTIONS['emi-pay'] = el => {
  const e = D.emis.find(x => x.id === el.dataset.id); if (!e) return;
  const paid = emiPaid(e); if (paid >= e.tenure) return;
  const k = paid + 1, t = { id: uid(), type: 'expense', amount: e.amount, category: 'EMI', date: today(), method: e.method || 'Card', note: `${e.name} · EMI ${k}/${e.tenure}`, tags: ['emi'], emiId: e.id, ts: Date.now(), ...((e.method || 'Card') === 'Card' && defaultCardId() && !serverOutdated() ? { cardId: defaultCardId() } : {}) };
  D.txns.push(t); Store.save(); render();
  toast(k === e.tenure ? `🎉 ${e.name} fully paid off!` : `EMI ${k}/${e.tenure} paid · ${fmt(e.amount)}`, 'Undo', () => { D.txns = D.txns.filter(x => x.id !== t.id); Store.save(); render(); });
};
ACTIONS['emi-add'] = () => emiForm(null);
ACTIONS['emi-edit'] = el => emiForm(D.emis.find(x => x.id === el.dataset.id));
ACTIONS['emi-manage'] = () => {
  const cur = curYM(), act = D.emis.filter(e => emiPaid(e) < e.tenure && e.start <= cur), up = D.emis.filter(e => e.start > cur), done = D.emis.filter(e => emiPaid(e) >= e.tenure);
  const monthly = sum(act, e => e.amount), sec = (t, l) => l.length ? `<div class="sec-title">${t}</div>${l.map(e => emiRow(e, cur, false)).join('')}` : '';
  openSheet('EMI tracker', `
    <div class="stats3" style="margin-top:4px">
      <div class="stat"><div class="l">Monthly outflow</div><div class="v">${fmt(monthly)}</div></div>
      <div class="stat"><div class="l">Outstanding</div><div class="v neg">${fmtC(sum(D.emis, emiLeft))}</div></div>
      <div class="stat"><div class="l">Closed</div><div class="v pos">${done.length}</div></div>
    </div>
    ${sec('Active', act)}${sec('Upcoming', up)}${sec('Completed', done)}
    ${D.emis.length ? '' : emptyState('💳', 'No EMIs yet', 'Add your no-cost EMIs, BNPL and credit-card EMIs.')}
    <div class="sheet-actions"><button class="btn primary" data-action="emi-add">+ Add EMI</button></div>`);
};

/* ---------- add / edit form ---------- */
function emiForm(e) {
  const f = e ? { ...e } : { name: '', icon: '📱', amount: '', tenure: 6, start: curYM(), dueDay: 5, method: 'Card', lender: '', prepaid: 0 };
  const linked = e ? D.txns.filter(t => t.emiId === e.id).length : 0;
  openSheet(e ? 'Edit EMI' : 'Add EMI', '', function draw(body) {
    body.innerHTML = `
      <label class="lbl" style="margin-top:6px">Icon</label><div class="icon-pick">${EMI_ICONS.map(i => `<button data-i="${i}" class="${f.icon === i ? 'on' : ''}">${i}</button>`).join('')}</div>
      <label class="lbl">What's on EMI?</label><input class="inp" id="emName" maxlength="40" placeholder="e.g. iPhone 16, Laptop, TV" value="${esc(f.name)}">
      <div class="row2"><div><label class="lbl">Monthly EMI</label><input class="inp" id="emAmt" inputmode="decimal" placeholder="₹ 0" value="${f.amount || ''}"></div>
        <div><label class="lbl">Tenure (months)</label><input class="inp" id="emTen" inputmode="numeric" value="${f.tenure}"></div></div>
      <div class="chips" style="margin-top:8px">${[3, 6, 9, 12, 18, 24].map(n => `<button class="chip${+f.tenure === n ? ' on' : ''}" data-t="${n}">${n} mo</button>`).join('')}</div>
      <div class="row2"><div><label class="lbl">First EMI month</label><input class="inp" id="emStart" type="month" value="${f.start}"></div>
        <div><label class="lbl">Due day</label><input class="inp" id="emDay" inputmode="numeric" value="${f.dueDay}"></div></div>
      <div class="row2"><div><label class="lbl">Paid via</label><select class="inp" id="emMethod">${METHODS.map(([m, i]) => `<option value="${m}" ${f.method === m ? 'selected' : ''}>${i} ${m}</option>`).join('')}</select></div>
        <div><label class="lbl">Paid before tracking</label><input class="inp" id="emPre" inputmode="numeric" value="${f.prepaid || 0}"></div></div>
      <label class="lbl">Lender / card</label><input class="inp" id="emLender" maxlength="40" placeholder="e.g. HDFC Credit Card · No-cost" value="${esc(f.lender)}">
      <div class="card" style="margin:16px 0 0;background:var(--surface-2)" id="emSum"></div>
      ${e ? `<p class="xs muted" style="margin-top:10px">${linked} installment${linked === 1 ? '' : 's'} recorded as transactions. Deleting a transaction un-pays that installment.</p>` : ''}
      <div class="sheet-actions">${e ? '<button class="btn danger-ghost" id="emDel">Delete</button>' : ''}<button class="btn primary" id="emSave">${e ? 'Save' : 'Add EMI'}</button></div>`;
    const read = () => {
      f.name = $('#emName', body).value; f.amount = parseAmt($('#emAmt', body).value); f.tenure = clamp(Math.round(parseAmt($('#emTen', body).value)) || 0, 0, 120);
      f.start = $('#emStart', body).value; f.dueDay = clamp(Math.round(parseAmt($('#emDay', body).value)) || 1, 1, 31);
      f.method = $('#emMethod', body).value; f.prepaid = clamp(Math.round(parseAmt($('#emPre', body).value)) || 0, 0, f.tenure); f.lender = $('#emLender', body).value;
    };
    const summary = () => {
      read(); const ok = f.amount > 0 && f.tenure > 0 && /^\d{4}-\d{2}$/.test(f.start);
      $('#emSum', body).innerHTML = ok ? `<div class="budget-top"><div><div class="xs muted">Total payable</div><div class="big">${fmt(f.amount * f.tenure)}</div></div><div style="text-align:right"><div class="xs muted">Ends</div><b>${mLabel(addMonths(f.start, f.tenure - 1), true)}</b></div></div>` : '<span class="muted sm">Enter amount, tenure and start month to see the total.</span>';
    };
    $$('.icon-pick button', body).forEach(b => b.onclick = () => { read(); f.icon = b.dataset.i; draw(body); });
    $$('[data-t]', body).forEach(b => b.onclick = () => { read(); f.tenure = +b.dataset.t; draw(body); });
    $$('input,select', body).forEach(i => i.addEventListener('input', summary));
    summary();
    $('#emSave', body).onclick = () => {
      read(); f.name = f.name.trim();
      if (!f.name) { toast('Enter what is on EMI'); return; }
      if (!(f.amount > 0)) { toast('Enter the monthly EMI amount'); return; }
      if (!(f.tenure > 0)) { toast('Enter tenure in months'); return; }
      if (!/^\d{4}-\d{2}$/.test(f.start)) { toast('Pick the first EMI month'); return; }
      if (e) Object.assign(D.emis.find(x => x.id === e.id), f); else D.emis.push({ ...f, id: 'em' + uid() });
      Store.save(); closeSheet(); render(); toast(e ? 'EMI updated' : 'EMI added ✓');
    };
    if (e) $('#emDel', body).onclick = async () => {
      if (!await confirmDlg('Delete EMI?', `"${e.name}" will be removed. Past payment transactions stay in your history.`)) return;
      D.emis = D.emis.filter(x => x.id !== e.id); D.txns.forEach(t => { if (t.emiId === e.id) delete t.emiId; });
      Store.save(); closeSheet(); render(); toast('EMI deleted');
    };
  });
}
</script>

<!-- ===================== SCRIPT 7: Recurring bills (one-tap monthly entries) ===================== -->
<script>
'use strict';
// A recurring item: { id, type, name, icon, amount, category, dueDay, method, tags[], active, since 'YYYY-MM' }
// Recorded for a month when a transaction with recurId === id exists in that month.
const REC_PRESETS = [
  ['House rent', '🏠', 'Rent', 5, 'Bank Transfer'], ['Society maintenance', '🏢', 'Bills & Utilities', 10, 'UPI'],
  ['Maid salary', '🧹', 'Household', 1, 'Cash'], ['Cook salary', '👩‍🍳', 'Household', 1, 'Cash'], ['Driver salary', '🚗', 'Transport', 1, 'Cash'],
  ['Milk', '🥛', 'Groceries', 1, 'UPI'], ['Newspaper', '📰', 'Bills & Utilities', 1, 'Cash'], ['Internet', '🌐', 'Bills & Utilities', 10, 'Card'],
  ['Mobile postpaid', '📱', 'Bills & Utilities', 15, 'Card'], ['OTT subscription', '📺', 'Subscriptions', 12, 'Card'], ['Gym', '🏋️', 'Health', 1, 'UPI'],
  ['SIP', '📈', 'Others', 5, 'Bank Transfer'], ['Insurance premium', '🛡️', 'Health', 1, 'Bank Transfer'], ['School fees', '🎒', 'Education', 10, 'Bank Transfer'],
];
const REC_ICONS = ['🏠', '🏢', '🧹', '👩‍🍳', '🚗', '🥛', '📰', '🌐', '📱', '📺', '🏋️', '📈', '🛡️', '🎒', '💡', '🔥', '💧', '🧺', '🐶', '💼'];
const recTx = (r, m) => D.txns.find(t => t.recurId === r.id && t.date.startsWith(m));
const recVisible = (r, m) => r.active !== false && (!r.since || r.since <= m);

// Status of a recurring item for month m: recorded | due | due-today | overdue | missed | upcoming
function recState(r, m) {
  if (recTx(r, m)) return 'recorded';
  const cur = curYM(); if (m < cur) return 'missed'; if (m > cur) return 'upcoming';
  const day = new Date().getDate(), due = Math.min(r.dueDay, daysInMonth(m));
  return day > due ? 'overdue' : day === due ? 'due-today' : 'due';
}
const REC_PILL = { recorded: ['ok', '✓ Done'], due: ['', 'Due'], 'due-today': ['warn', 'Due today'], overdue: ['over', 'Overdue'], missed: ['', 'Not recorded'], upcoming: ['', 'Upcoming'] };
function recRow(r, m, withBtn) {
  const st = recState(r, m), [cls, lbl] = REC_PILL[st], t = recTx(r, m), inc = r.type === 'income';
  const dl = Math.min(r.dueDay, daysInMonth(m)) - new Date().getDate();
  const canRec = withBtn && ['due', 'due-today', 'overdue', 'missed'].includes(st);
  return `<div class="emi${r.active === false ? ' paused' : ''}"><div class="emi-top">
      <div class="ic" data-action="rec-edit" data-id="${esc(r.id)}" style="cursor:pointer;background:${hexA(cat(r.type, r.category).color, .16)}">${r.icon || '🔁'}</div>
      <div class="mid" data-action="rec-edit" data-id="${esc(r.id)}" style="cursor:pointer"><div class="n">${esc(r.name)}</div>
        <div class="g">${inc ? '+' : ''}${fmt(t ? t.amount : r.amount)} · ${ordinal(r.dueDay)} · ${methodIcon(r.method)} ${esc(r.method)}${r.active === false ? ' · paused' : ''}</div></div>
      <div class="r">${canRec
        ? `<button class="btn xs ${inc ? 't-income' : 'primary'}" data-action="rec-record" data-id="${esc(r.id)}">${inc ? 'Receive' : 'Record'}</button><span class="xs ${st === 'overdue' ? 'neg' : 'muted'}">${st === 'due' ? `in ${dl}d` : lbl}</span>`
        : `<span class="pill ${cls}" ${t ? `data-action="edit-tx" data-id="${esc(t.id)}" style="cursor:pointer"` : ''}>${lbl}</span>`}</div></div></div>`;
}
function recRecord(r, m) {
  const date = m === curYM() ? today() : `${m}-${pad(Math.min(r.dueDay, daysInMonth(m)))}`;
  const t = { id: uid(), type: r.type, amount: r.amount, category: r.category, date, method: r.method, note: r.name, tags: [...(r.tags || [])], recurId: r.id, ts: Date.now(), ...(r.method === 'Card' && defaultCardId() && !serverOutdated() ? { cardId: defaultCardId() } : {}) };
  D.txns.push(t); return t;
}

/* ---------- Home card ---------- */
function recurCard(m) {
  const list = D.recurring.filter(r => recVisible(r, m));
  if (!D.recurring.length) return `<div class="card"><div class="card-h"><div><h3>Recurring bills</h3><div class="sub">Rent, maintenance, maid, cook…</div></div></div>
    <p class="muted sm" style="margin-bottom:12px">Set up monthly payments once, then record each with a single tap.</p>
    <button class="btn ghost block" data-action="rec-add">+ Add recurring bill</button></div>`;
  if (!list.length) return '';
  const order = { overdue: 0, 'due-today': 1, due: 2, missed: 3, upcoming: 4, recorded: 5 };
  list.sort((a, b) => order[recState(a, m)] - order[recState(b, m)] || a.dueDay - b.dueDay);
  const exp = list.filter(r => r.type === 'expense'), done = exp.filter(r => recTx(r, m));
  const total = sum(exp, r => r.amount), doneAmt = sum(done, r => recTx(r, m).amount);
  const pend = list.filter(r => ['due', 'due-today', 'overdue', 'missed'].includes(recState(r, m)));
  const pendExp = sum(pend.filter(r => r.type === 'expense'), r => r.amount);
  return `<div class="card"><div class="card-h"><div><h3>Recurring bills</h3><div class="sub">${done.length}/${exp.length} paid · ${fmt(doneAmt)} of ${fmt(total)}</div></div><a class="link" data-action="rec-manage">Manage</a></div>
    <div class="emi-prog" style="margin:0 0 4px"><i class="${done.length === exp.length ? 'done' : ''}" style="width:${total ? doneAmt / total * 100 : 0}%"></i></div>
    ${list.map(r => recRow(r, m, m <= curYM())).join('')}
    ${pend.length > 1 && m <= curYM() ? `<button class="btn primary block" style="margin-top:12px" data-action="rec-all">⚡ Record all ${pend.length} pending${pendExp ? ` · ${fmt(pendExp)}` : ''}</button>` : ''}</div>`;
}

/* ---------- actions ---------- */
ACTIONS['rec-record'] = el => {
  const r = D.recurring.find(x => x.id === el.dataset.id); if (!r || recTx(r, S.month)) return;
  const t = recRecord(r, S.month); Store.save(); render();
  toast(`${r.type === 'income' ? '+' : '−'}${fmt(r.amount)} · ${r.name} recorded`, 'Undo', () => { D.txns = D.txns.filter(x => x.id !== t.id); Store.save(); render(); });
};
ACTIONS['rec-all'] = () => {
  const m = S.month, pend = D.recurring.filter(r => recVisible(r, m) && !recTx(r, m));
  const added = pend.map(r => recRecord(r, m)); Store.save(); render();
  toast(`${added.length} recurring entries recorded ✓`, 'Undo', () => { const ids = new Set(added.map(t => t.id)); D.txns = D.txns.filter(x => !ids.has(x.id)); Store.save(); render(); });
};
ACTIONS['rec-add'] = () => recForm(null);
ACTIONS['rec-edit'] = el => recForm(D.recurring.find(x => x.id === el.dataset.id));
ACTIONS['rec-manage'] = () => {
  const act = D.recurring.filter(r => r.active !== false), paused = D.recurring.filter(r => r.active === false);
  const expT = sum(act.filter(r => r.type === 'expense'), r => r.amount), incT = sum(act.filter(r => r.type === 'income'), r => r.amount);
  const cur = curYM(), row = r => recRow(r, cur, false);
  openSheet('Recurring bills', `
    <div class="stats3" style="margin-top:4px">
      <div class="stat"><div class="l">Monthly bills</div><div class="v neg">${fmtC(expT)}</div></div>
      <div class="stat"><div class="l">Recurring income</div><div class="v pos">${fmtC(incT)}</div></div>
      <div class="stat"><div class="l">Yearly bills</div><div class="v">${fmtC(expT * 12)}</div></div>
    </div>
    ${act.length ? `<div class="sec-title">Active · ${act.length}</div>${act.slice().sort((a, b) => a.dueDay - b.dueDay).map(row).join('')}` : ''}
    ${paused.length ? `<div class="sec-title">Paused</div>${paused.map(row).join('')}` : ''}
    ${D.recurring.length ? '' : emptyState('🔁', 'No recurring bills yet', 'Add rent, maintenance, maid, cook and more.')}
    <p class="xs muted" style="margin-top:12px">Tap an item to edit, pause or delete it.</p>
    <div class="sheet-actions"><button class="btn primary" data-action="rec-add">+ Add recurring</button></div>`);
};

/* ---------- add / edit form ---------- */
function recForm(r) {
  const f = r ? { ...r, tags: [...(r.tags || [])] } : { type: 'expense', name: '', icon: '🏠', amount: '', category: 'Rent', dueDay: 1, method: 'UPI', tags: [], active: true };
  openSheet(r ? 'Edit recurring' : 'Add recurring', '', function draw(body) {
    const cats = D.categories[f.type];
    if (!cats.some(c => c.name === f.category)) f.category = cats[0] ? cats[0].name : '';
    body.innerHTML = `
      <div class="seg type" style="margin-top:4px">${['expense', 'income'].map(v => `<button data-ty="${v}" data-v="${v}" class="${f.type === v ? 'on' : ''}">${v === 'expense' ? '− Expense' : '+ Income'}</button>`).join('')}</div>
      ${!r && f.type === 'expense' ? `<label class="lbl">Quick pick</label><div class="chips" style="flex-wrap:wrap">${REC_PRESETS.map((p, i) => `<button class="chip${f.name === p[0] ? ' on' : ''}" data-p="${i}">${p[1]} ${esc(p[0])}</button>`).join('')}</div>` : ''}
      <label class="lbl">Name</label><input class="inp" id="rcName" maxlength="40" placeholder="${f.type === 'expense' ? 'e.g. Maid salary' : 'e.g. Salary, Rent received'}" value="${esc(f.name)}">
      <div class="row2"><div><label class="lbl">Amount / month</label><input class="inp" id="rcAmt" inputmode="decimal" placeholder="₹ 0" value="${f.amount || ''}"></div>
        <div><label class="lbl">Due day</label><input class="inp" id="rcDay" inputmode="numeric" value="${f.dueDay}"></div></div>
      <div class="row2"><div><label class="lbl">Category</label><select class="inp" id="rcCat">${cats.map(c => `<option value="${esc(c.name)}" ${c.name === f.category ? 'selected' : ''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select></div>
        <div><label class="lbl">Paid via</label><select class="inp" id="rcMethod">${METHODS.map(([m, i]) => `<option value="${m}" ${f.method === m ? 'selected' : ''}>${i} ${m}</option>`).join('')}</select></div></div>
      <label class="lbl">Icon</label><div class="icon-pick">${REC_ICONS.map(i => `<button data-i="${i}" class="${f.icon === i ? 'on' : ''}">${i}</button>`).join('')}</div>
      <label class="lbl">Tags</label><input class="inp" id="rcTags" placeholder="comma separated, e.g. home, help" value="${esc(f.tags.join(', '))}">
      ${r ? `<div class="set-group" style="margin-top:16px"><label class="set-item" style="cursor:pointer"><span class="ic">⏸️</span><span class="t">Active<small>Turn off to pause without deleting</small></span><span class="switch"><input type="checkbox" id="rcActive" ${f.active !== false ? 'checked' : ''}><span></span></span></label></div>
        <p class="xs muted" style="margin-top:10px">Changes apply to future entries. Already recorded transactions stay as they are.</p>` : ''}
      <div class="sheet-actions">${r ? '<button class="btn danger-ghost" id="rcDel">Delete</button>' : ''}<button class="btn primary" id="rcSave">${r ? 'Save' : 'Add recurring'}</button></div>`;
    const read = () => {
      f.name = $('#rcName', body).value; f.amount = parseAmt($('#rcAmt', body).value);
      f.dueDay = clamp(Math.round(parseAmt($('#rcDay', body).value)) || 1, 1, 31); f.category = $('#rcCat', body).value; f.method = $('#rcMethod', body).value;
      f.tags = $('#rcTags', body).value.split(',').map(s => s.trim().toLowerCase().replace(/^#/, '').replace(/\s+/g, '-').replace(/[^\w-]/g, '')).filter(Boolean);
      const a = $('#rcActive', body); if (a) f.active = a.checked;
    };
    $$('[data-ty]', body).forEach(b => b.onclick = () => { read(); f.type = b.dataset.ty; f.icon = f.type === 'income' ? '💼' : f.icon; draw(body); });
    $$('[data-p]', body).forEach(b => b.onclick = () => { read(); const p = REC_PRESETS[+b.dataset.p]; Object.assign(f, { name: p[0], icon: p[1], category: p[2], dueDay: p[3], method: p[4] }); draw(body); setTimeout(() => $('#rcAmt', body).focus(), 50); });
    $$('.icon-pick button', body).forEach(b => b.onclick = () => { read(); f.icon = b.dataset.i; draw(body); });
    $('#rcSave', body).onclick = () => {
      read(); f.name = f.name.trim();
      if (!f.name) { toast('Enter a name'); return; }
      if (!(f.amount > 0)) { toast('Enter the monthly amount'); return; }
      if (r) Object.assign(D.recurring.find(x => x.id === r.id), f);
      else D.recurring.push({ ...f, id: 'rc' + uid(), active: true, since: curYM() });
      Store.save(); closeSheet(); render(); toast(r ? 'Recurring item updated' : `${f.name} added · record it with one tap ✓`);
    };
    if (r) $('#rcDel', body).onclick = async () => {
      if (!await confirmDlg('Delete recurring item?', `"${r.name}" will be removed. Past transactions stay in your history.`)) return;
      D.recurring = D.recurring.filter(x => x.id !== r.id); D.txns.forEach(t => { if (t.recurId === r.id) delete t.recurId; });
      Store.save(); closeSheet(); render(); toast('Recurring item deleted');
    };
  });
}
</script>
</body>
</html>
